name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx @vscode/vsce package --no-dependencies --allow-star-activation
      - name: Publish to Open VSX
        run: npx ovsx publish ./*.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Publish to VS Code Marketplace
        # Skipped until the VSCE_PAT secret exists, so Open VSX releases keep working.
        if: env.VSCE_PAT != ''
        run: npx @vscode/vsce publish --packagePath ./*.vsix -p "$VSCE_PAT"
