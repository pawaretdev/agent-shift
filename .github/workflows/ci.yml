name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npx tsc --noEmit
      - run: xvfb-run -a npm run test:integration
      - run: npx @vscode/vsce package --no-dependencies --allow-star-activation
      - uses: actions/upload-artifact@v4
        with:
          name: agent-shift-vsix
          path: '*.vsix'
